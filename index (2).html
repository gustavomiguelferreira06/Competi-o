<style>

.sheet input{width:100%;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--mute);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.chip2.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip2.lock{opacity:.6;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);margin-top:8px}

.rk .tot small{font-size:12px;font-weight:600;color:var(--mute)}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav .icon:disabled{opacity:.3}
.calt{text-transform:capitalize;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:2px}
.cd{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:2px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;overflow:hidden}
.cd b{font-size:13px;font-weight:700;position:relative;z-index:1}
.cd small{font-size:10px;line-height:1;position:relative;z-index:1;min-height:11px}
.cd.has{border-color:var(--pc)}
.cd.has::before{content:'';position:absolute;inset:0;background:var(--pc);opacity:.22}
.cd.today{outline:2px solid var(--ink);outline-offset:-2px}
.cd.sel{box-shadow:0 0 0 2px var(--pc)}
.cd.out{opacity:.35;pointer-events:none}
.cn{position:absolute;top:2px;right:4px;font-size:9px;font-style:normal;font-weight:800;color:var(--pc);z-index:1}
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.cnts b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.cnts span{font-size:11px;color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:90%;text-align:center}
</style>

<script type="module">
/* =====================================================================
   CONFIGURAÇÃO DO FIREBASE
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAXTj8OtIwB0iZMsOGjKe2nOHFyicKDvlA",
  authDomain: "competicao-84a97.firebaseapp.com",
  projectId: "competicao-84a97",
  storageBucket: "competicao-84a97.firebasestorage.app",
  messagingSenderId: "1027885066265",
  appId: "1:1027885066265:web:abfda531552e4eac95a288"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

function makeDb(){
  var app=initializeApp(firebaseConfig), fs=getFirestore(app);
  function docRef(path){
    var r=doc(fs,path);
    return {
      set:function(d){return setDoc(r,d);},
      update:function(d){return updateDoc(r,d);},
      delete:function(){return deleteDoc(r);},
      onSnapshot:function(n,e){return onSnapshot(r,function(x){n({exists:x.exists(),data:function(){return x.data();}});},e);}
    };
  }
  return {
    doc:docRef,
    collection:function(path){
      var c=collection(fs,path);
      return {
        add:function(d){return addDoc(c,d);},
        onSnapshot:function(n,e){return onSnapshot(c,function(x){n({docs:x.docs});},e);}
      };
    }
  };
}

(function(){
'use strict';

var START='2026-10-12', END='2026-12-31';
var MUSCLES=['Peito','Costas','Perna','Ombros','Bíceps','Tríceps','Abdômen','Glúteos'];
var DEFAULT_GOAL=150, MAX_PLAYERS=5;
var UID_KEY='desafio_uid', SEL_KEY='desafio_comp';

var db=null, uid=null, needConfig=false;
var players=[], workouts=[], comps=[], settings={kmGoal:DEFAULT_GOAL};
var loaded={p:false,w:false,s:false,c:false}, forceShow=false, nodb=false, subErr='';
var tab='placar', sel='all', addKind='run', selM=new Set(), selMem=new Set(), editId=null, delArm=false;
var calMonth=today0().slice(0,7), calPid=null, calKind='all', calDay=null, compMode='both';
var saving=false, delId=null, delTimer=null, joinPrompted=false, toastTimer=null;

function $(id){return document.getElementById(id);}
function today0(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parts(s){var p=s.split('-');return [+p[0],+p[1],+p[2]];}
function utc(s){var p=parts(s);return Date.UTC(p[0],p[1]-1,p[2]);}
function diffDays(a,b){return Math.round((utc(b)-utc(a))/86400000);}
function addDays(s,n){var p=parts(s);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10);}
function clampDate(s){return s<START?START:(s>END?END:s);}
function fmtDate(s){var p=parts(s);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});}
function fmtShort(s){var p=parts(s);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('pt-BR',{day:'numeric',month:'short'});}
function f1(n){return (Math.round(n*10)/10).toFixed(1).replace('.',',');}
function fInt(n){return ''+n;}
function fPace(m){if(m==null)return '—';var t=Math.round(m*60);return Math.floor(t/60)+':'+pad(t%60)+'/km';}
function ini(n){return esc((n||'?').trim().charAt(0).toUpperCase());}
function colorOf(pid){var i=players.findIndex(function(p){return p.id===pid;});return i<0?'var(--mute)':'var(--c'+((i%5)+1)+')';}

function toast(msg){
  var t=$('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},2800);
}

/* ---------- competição atual ---------- */
function me(){return players.find(function(p){return p.id===uid;})||null;}
function visibleComps(){
  var m=me();
  return comps.filter(function(c){return !m||c.members.indexOf(uid)>=0;});
}
function mkCtx(c,members){
  var start=c.start||START,end=c.end||END,total=diffDays(start,end)+1;
  return {id:c.id,name:c.name,mode:c.mode||'both',start:start,end:end,total:total,weeks:Math.max(1,Math.ceil(total/7)),members:members,createdBy:c.createdBy||null,isAll:c.id==='all'};
}
function curComp(){
  var c=sel!=='all'?comps.find(function(x){return x.id===sel;}):null;
  if(!c)return mkCtx({id:'all',name:'Desafio Fim de Ano',start:START,end:END},players.slice());
  return mkCtx(c,players.filter(function(p){return c.members.indexOf(p.id)>=0;}));
}

/* ---------- estatísticas ---------- */
function okType(C,t){return C.mode==='both'||C.mode===t;}
function modeLabel(C){return C.isAll?'':(C.mode==='run'?' · só km':(C.mode==='gym'?' · só academia':' · km + academia'));}
function stats(pid,C){
  var ws=workouts.filter(function(w){return w.uid===pid&&w.date>=C.start&&w.date<=C.end&&okType(C,w.type);});
  var runs=ws.filter(function(w){return w.type==='run';});
  var gym=ws.filter(function(w){return w.type==='gym';});
  var km=0,pk=0,pm=0,longest=0;
  runs.forEach(function(w){
    var k=+w.km||0;km+=k;if(k>longest)longest=k;
    if(w.dur>0&&k>0){pk+=k;pm+=+w.dur;}
  });
  var days=new Set(ws.map(function(w){return w.date;}));
  var mus={};MUSCLES.forEach(function(m){mus[m]=0;});
  gym.forEach(function(w){(w.muscles||[]).forEach(function(m){if(m in mus)mus[m]++;});});
  var streak=0,d=today();
  if(d>C.end)d=C.end;
  if(!days.has(d))d=addDays(d,-1);
  while(days.has(d)){streak++;d=addDays(d,-1);}
  var elapsed=Math.min(C.total,Math.max(1,diffDays(C.start,today())+1));
  var weeksEl=Math.max(1,elapsed/7);
  return {n:ws.length,runs:runs.length,gym:gym.length,km:km,longest:longest,
    avgKm:runs.length?km/runs.length:null,pace:pk>0?pm/pk:null,days:days.size,mus:mus,
    streak:streak,runsWk:runs.length/weeksEl,gymWk:gym.length/weeksEl,
    muscleCount:MUSCLES.filter(function(m){return mus[m]>0;}).length};
}

function weekly(pid,kind,C){
  var a=[];for(var i=0;i<C.weeks;i++)a.push(0);
  workouts.forEach(function(w){
    if(w.uid!==pid||w.date<C.start||w.date>C.end)return;
    if(kind==='all'){if(!okType(C,w.type))return;}else if(w.type!==kind)return;
    var idx=Math.floor(diffDays(C.start,w.date)/7);
    if(idx>=0&&idx<C.weeks)a[idx]++;
  });
  return a;
}

/* ---------- componentes ---------- */
function tbl(P,S,rows){
  var cols='grid-template-columns:'+(P.length>3?'84px':'104px')+' repeat('+P.length+',1fr)';
  var h='<div class="trow thd" style="'+cols+'"><div></div>'+P.map(function(p){
    return '<div class="th"><i class="av2" style="background:'+colorOf(p.id)+'">'+ini(p.name)+'</i><span>'+esc(p.name)+'</span></div>';
  }).join('')+'</div>';
  rows.forEach(function(r){
    var vals=S.map(r[1]);
    var nn=vals.filter(function(v){return v!=null;});
    var best=null;
    if(nn.length)best=r[3]?Math.min.apply(null,nn):Math.max.apply(null,nn);
    var allEq=nn.every(function(v){return v===nn[0];});
    var show=best!=null&&!allEq&&!(!r[3]&&best===0);
    h+='<div class="trow" style="'+cols+'"><div class="tl">'+r[0]+'</div>'+vals.map(function(v,i){
      var lead=show&&v===best;
      return '<div class="tv'+(lead?' lead':'')+'"'+(lead?' style="color:'+colorOf(P[i].id)+'"':'')+'>'+(v==null?'—':r[2](v))+'</div>';
    }).join('')+'</div>';
  });
  return h;
}

function legend(P){
  return '<div class="legend">'+P.map(function(p){return '<span><i style="background:'+colorOf(p.id)+'"></i>'+esc(p.name)+'</span>';}).join('')+'</div>';
}

function weekChart(P,S,kind,C){
  var arrs=P.map(function(p){return weekly(p.id,kind,C);});
  var flat=[].concat.apply([],arrs);
  var mx=Math.max.apply(null,[1].concat(flat));
  var t=today(),cur=(t<C.start||t>C.end)?-1:Math.min(C.weeks-1,Math.floor(diffDays(C.start,t)/7));
  var labels=P.length<=3;
  var h='<div class="wk">';
  for(var i=0;i<C.weeks;i++){
    h+='<div class="wcol'+(i===cur?' cur':'')+'"><div class="bars">';
    P.forEach(function(p,k){
      var v=arrs[k][i];
      h+='<div class="bar'+(v?'':' z')+'" style="height:'+(v/mx*100)+'%;background:'+colorOf(p.id)+'">'+(labels?'<span>'+(v||'')+'</span>':'')+'</div>';
    });
    h+='</div><div class="wl">S'+(i+1)+'</div></div>';
  }
  return h+'</div>'+legend(P);
}

function gauge(p,s){
  var goal=settings.kmGoal||DEFAULT_GOAL,color=colorOf(p.id);
  var pct=Math.min(100,s.km/goal*100);
  var arc='M10 62 A50 50 0 0 1 110 62';
  var prog=pct>=0.5?'<path d="'+arc+'" pathLength="100" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+pct+' 100"/>':'';
  return '<div class="gauge"><svg viewBox="0 0 120 70"><path d="'+arc+'" pathLength="100" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>'+prog+'</svg>'+
    '<div class="gv"><b>'+f1(s.km)+'</b><small>km</small></div>'+
    '<div class="gn" style="color:'+color+'">'+esc(p.name)+'</div><div class="gs">'+(s.km>=goal?'🎉 meta batida':Math.round(pct)+'% da meta')+'</div></div>';
}

/* ---------- telas ---------- */
function viewPlacar(P,S,C){
  if(!P.length)return '<div class="card"><div class="empty">Ainda não tem ninguém na disputa.</div></div>';
  var md=C.mode;
  function key(s){return md==='run'?s.km:(md==='gym'?s.gym:s.n);}
  function fk(v){return md==='run'?f1(v):fInt(v);}
  var rows=P.map(function(p,i){return {p:p,s:S[i]};}).sort(function(a,b){
    var d=key(b.s)-key(a.s);
    if(d)return d;
    return md==='gym'?(b.s.days-a.s.days):(md==='run'?(b.s.runs-a.s.runs):(b.s.km-a.s.km));
  });
  var top=Math.max(0.0001,key(rows[0].s)),rank=0,prev=null;
  var title=md==='run'?'Ranking · km corridos':(md==='gym'?'Ranking · academia':'Ranking · treinos');
  var h='<div class="card"><h3>'+title+'</h3>';
  rows.forEach(function(r,i){
    var v=key(r.s);
    if(v!==prev){rank=i+1;prev=v;}
    var medal=(v>0&&rank<=3)?['🥇','🥈','🥉'][rank-1]:rank;
    var col=colorOf(r.p.id),dt;
    if(md==='run')dt=r.s.runs+' corridas · maior '+f1(r.s.longest)+' km';
    else if(md==='gym')dt=r.s.gym+' sessões · '+r.s.muscleCount+' grupos';
    else dt=r.s.runs+' corridas · '+r.s.gym+' academia · '+f1(r.s.km)+' km';
    h+='<div class="rk"><div class="pos">'+medal+'</div><i class="av2" style="background:'+col+'">'+ini(r.p.name)+'</i>'+
      '<div class="mid"><div class="nm">'+esc(r.p.name)+(r.p.id===uid?' (você)':'')+'</div>'+
      '<div class="dt">'+dt+'</div>'+
      '<div class="b2"><i style="width:'+(v/top*100)+'%;background:'+col+'"></i></div></div>'+
      '<div class="tot" style="color:'+col+'">'+fk(v)+(md==='run'?'<small> km</small>':'')+'</div></div>';
  });
  function unit(d){return md==='run'?f1(d)+' km':(md==='gym'?d+(d>1?' sessões':' sessão'):d+(d>1?' treinos':' treino'));}
  var ended=today()>C.end,status,k0=key(rows[0].s);
  if(rows.length<2)status='Convide mais gente para competir 🏁';
  else if(k0===0)status='Ninguém pontuou ainda — larguem! 🏁';
  else if(k0===key(rows[1].s)){
    var tied=rows.filter(function(r){return key(r.s)===k0;}).map(function(r){return esc(r.p.name);});
    status=(ended?'Terminou empatado: ':'Empate no topo: ')+tied.join(' e ')+' 🤝';
  }else{
    var diff=k0-key(rows[1].s);
    status=ended?'🏆 Campeão: '+esc(rows[0].p.name):esc(rows[0].p.name)+' lidera por '+unit(diff);
  }
  h+='<div class="status">'+status+'</div></div>';
  var trows;
  if(md==='run')trows=[
    ['Km corridos',function(s){return s.km;},f1],
    ['Corridas',function(s){return s.runs;},fInt],
    ['Maior (km)',function(s){return s.longest||null;},f1],
    ['Dias ativos',function(s){return s.days;},fInt],
    ['Sequência (dias)',function(s){return s.streak;},fInt]];
  else if(md==='gym')trows=[
    ['Sessões',function(s){return s.gym;},fInt],
    ['Grupos diferentes',function(s){return s.muscleCount;},fInt],
    ['Dias ativos',function(s){return s.days;},fInt],
    ['Sequência (dias)',function(s){return s.streak;},fInt]];
  else trows=[
    ['Treinos totais',function(s){return s.n;},fInt],
    ['Corridas',function(s){return s.runs;},fInt],
    ['Academia',function(s){return s.gym;},fInt],
    ['Km corridos',function(s){return s.km;},f1],
    ['Dias ativos',function(s){return s.days;},fInt],
    ['Sequência (dias)',function(s){return s.streak;},fInt]];
  h+='<div class="card"><h3>Frente a frente</h3>'+tbl(P,S,trows)+'</div>';
  var wt=md==='run'?'Corridas por semana':(md==='gym'?'Academia por semana':'Treinos por semana');
  h+='<div class="card"><h3>'+wt+'</h3>'+weekChart(P,S,'all',C)+'</div>';
  return h;
}

function viewCorrida(P,S,C){
  var goal=settings.kmGoal||DEFAULT_GOAL;
  return '<div class="card"><h3>Medidor de distância</h3><div class="gauges">'+P.map(function(p,i){return gauge(p,S[i]);}).join('')+'</div>'+
    '<div class="goalnote">Meta de cada um: '+goal+' km · altere em ⚙︎</div></div>'+
    '<div class="card"><h3>Frequência de corrida</h3>'+tbl(P,S,[
      ['Corridas',function(s){return s.runs;},fInt],
      ['Por semana',function(s){return s.runsWk;},f1],
      ['Km total',function(s){return s.km;},f1],
      ['Média (km)',function(s){return s.avgKm;},f1],
      ['Maior (km)',function(s){return s.longest||null;},f1],
      ['Ritmo médio',function(s){return s.pace;},fPace,true]
    ])+'</div>'+

function viewAcademia(P,S,C){
  var mx=1;
  S.forEach(function(s){MUSCLES.forEach(function(m){mx=Math.max(mx,s.mus[m]);});});
  var bh=P.length>3?6:8,rows='';
  MUSCLES.forEach(function(m){
    rows+='<div class="mrow"><div class="ml">'+m+'</div><div class="mb">'+P.map(function(p,i){
      var v=S[i].mus[m],col=colorOf(p.id);
      return '<div class="mbar"><i style="height:'+bh+'px;width:'+(v/mx*100)+'%;background:'+col+';opacity:'+(v?1:.25)+'"></i><span style="color:'+col+'">'+v+'</span></div>';
    }).join('')+'</div></div>';
  });
  return '<div class="card"><h3>Frequência de academia</h3>'+tbl(P,S,[
      ['Sessões',function(s){return s.gym;},fInt],
      ['Por semana',function(s){return s.gymWk;},f1],
      ['Grupos diferentes',function(s){return s.muscleCount;},fInt]
    ])+'</div>'+
    '<div class="card"><h3>O que foi treinado</h3>'+rows+legend(P)+'</div>'+
    '<div class="card"><h3>Academia por semana</h3>'+weekChart(P,S,'gym',C)+'</div>';
}

function viewHist(P,C){
  var ids={};P.forEach(function(p){ids[p.id]=p;});
  var items=workouts.filter(function(w){return ids[w.uid]&&w.date>=C.start&&w.date<=C.end&&okType(C,w.type);}).sort(function(a,b){
    return a.date<b.date?1:a.date>b.date?-1:((b.ts||0)-(a.ts||0));
  });
  if(!items.length)return '<div class="card"><div class="empty">Nenhum treino registrado ainda.<br>Toque em “＋ Registrar” pra abrir o placar.</div></div>';
  var h='<div class="card"><h3>Todos os treinos ('+items.length+')</h3>';
  items.forEach(function(w){
    var p=ids[w.uid];
    var what=w.type==='run'?'correu '+f1(+w.km||0)+' km':'academia: '+esc((w.muscles||[]).join(', '));
    if(w.dur>0)what+=' · '+w.dur+' min';
    var own=w.uid===uid;
    h+='<div class="item"><div class="ic">'+(w.type==='run'?'🏃':'🏋️')+'</div><div class="mid"><b style="color:'+colorOf(w.uid)+'">'+esc(p.name)+'</b> '+what+
      '<div class="d">'+esc(fmtDate(w.date))+'</div></div>'+
      (own?'<button type="button" class="del'+(delId===w.id?' sure':'')+'" data-act="del" data-id="'+esc(w.id)+'">'+(delId===w.id?'Confirmar?':'Apagar')+'</button>':'')+
    '</div>';
  });
  return h+'</div>';
}

function shiftMonth(ym,d){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+d;var dt=new Date(y,m,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1);}

function viewCal(){
  if(!players.length)return '<div class="card"><div class="empty">Ainda não tem ninguém na disputa.</div></div>';
  if(!calPid||!players.some(function(p){return p.id===calPid;}))calPid=me()?uid:players[0].id;
  var minM=START.slice(0,7),maxM=END.slice(0,7);
  if(calMonth<minM)calMonth=minM;
  if(calMonth>maxM)calMonth=maxM;
  var col=colorOf(calPid);
  var ws=workouts.filter(function(w){return w.uid===calPid&&w.date>=START&&w.date<=END&&(calKind==='all'||w.type===calKind);});
  var byDay={};ws.forEach(function(w){(byDay[w.date]=byDay[w.date]||[]).push(w);});
  var y=+calMonth.slice(0,4),mo=+calMonth.slice(5,7);
  var first=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate(),t=today();
  var title=new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  function cnt(list){
    return {n:list.length,
      r:list.filter(function(w){return w.type==='run';}).length,
      g:list.filter(function(w){return w.type==='gym';}).length,
      d:new Set(list.map(function(w){return w.date;})).size};
  }
  var A=cnt(ws),M=cnt(ws.filter(function(w){return w.date.slice(0,7)===calMonth;}));
  function cells(c){
    return '<div class="cnts"><div><b>'+c.n+'</b><span>atividades</span></div><div><b>'+c.d+'</b><span>dias ativos</span></div><div><b>'+c.r+'</b><span>corridas</span></div><div><b>'+c.g+'</b><span>academia</span></div></div>';
  }
  var h='<div class="card"><div class="comps" style="margin-bottom:8px">'+players.map(function(p){
    return '<button type="button" class="cp'+(p.id===calPid?' on':'')+'" data-act="calpid" data-id="'+esc(p.id)+'">'+esc(p.name)+(p.id===uid?' (você)':'')+'</button>';
  }).join('')+'</div>';
  h+='<div class="seg" style="margin-bottom:12px">'+[['all','Tudo'],['run','🏃 Corrida'],['gym','🏋️ Academia']].map(function(k){
    return '<button type="button" class="'+(calKind===k[0]?'on':'')+'" data-act="calkind" data-k="'+k[0]+'">'+k[1]+'</button>';
  }).join('')+'</div>';
  h+='<div class="calnav"><button type="button" class="icon" data-act="calmonth" data-d="-1"'+(calMonth<=minM?' disabled':'')+'>‹</button><b class="calt">'+esc(title)+'</b><button type="button" class="icon" data-act="calmonth" data-d="1"'+(calMonth>=maxM?' disabled':'')+'>›</button></div>';
  h+='<div class="cal">'+['D','S','T','Q','Q','S','S'].map(function(d){return '<div class="cw">'+d+'</div>';}).join('');
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d=1;d<=dim;d++){
    var ds=calMonth+'-'+pad(d),list=byDay[ds]||[],out=ds<START||ds>END,ic='';
    if(list.some(function(w){return w.type==='run';}))ic+='🏃';
    if(list.some(function(w){return w.type==='gym';}))ic+='🏋️';
    h+='<button type="button" class="cd'+(list.length?' has':'')+(ds===t?' today':'')+(ds===calDay?' sel':'')+(out?' out':'')+'" style="--pc:'+col+'" data-act="calday" data-d="'+ds+'"'+(out?' disabled':'')+'><b>'+d+'</b><small>'+ic+'</small>'+(list.length>1?'<i class="cn">'+list.length+'</i>':'')+'</button>';
  }
  h+='</div></div>';
  h+='<div class="card"><h3>Contador de atividades</h3>'+cells(A)+
     '<h3 style="margin-top:16px">'+esc(title)+'</h3>'+cells(M)+
     '<div class="goalnote">Mostra tudo o que foi registrado, em qualquer competição.</div></div>';
  if(calDay){
    var dl=(byDay[calDay]||[]).slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);});
    h+='<div class="card"><h3>'+esc(fmtDate(calDay))+'</h3>'+(dl.length?dl.map(function(w){
      var what=w.type==='run'?'Corrida: '+f1(+w.km||0)+' km':'Academia: '+esc((w.muscles||[]).join(', '));
      if(w.dur>0)what+=' · '+w.dur+' min';
      return '<div class="item"><div class="ic">'+(w.type==='run'?'🏃':'🏋️')+'</div><div class="mid">'+what+'</div></div>';
    }).join(''):'<div class="empty" style="padding:8px">Nenhuma atividade neste dia.</div>')+'</div>';
  }
  return h;
}

function syncTabs(C){
  var tc=document.querySelector('#tabs [data-t="corrida"]'),ta=document.querySelector('#tabs [data-t="academia"]');
  tc.hidden=C.mode==='gym';ta.hidden=C.mode==='run';
  if((tab==='corrida'&&tc.hidden)||(tab==='academia'&&ta.hidden))tab='placar';
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===tab);});
}

function compBar(C){
  var h='<div class="comps"><button type="button" class="cp'+(C.isAll?' on':'')+'" data-act="selcomp" data-id="all">Todos</button>';
  visibleComps().forEach(function(c){
    h+='<button type="button" class="cp'+(C.id===c.id?' on':'')+'" data-act="selcomp" data-id="'+esc(c.id)+'">'+esc(c.name)+'</button>';
  });
  if(me()){
    if(!C.isAll&&C.createdBy===uid)h+='<button type="button" class="cp new" data-act="editcomp">✎ Editar</button>';
    h+='<button type="button" class="cp new" data-act="newcomp">＋ Nova competição</button>';
  }
  return h+'</div>';
}

function render(){
  var m=$('main');
  if(nodb){
    m.innerHTML='<div class="card"><div class="empty">'+(needConfig?'Falta configurar o Firebase.<br>Cole os dados do seu projeto no início do arquivo HTML.':'Não consegui conectar ao banco de dados.<br>Verifique a internet e a configuração.')+'</div></div>';
    $('fab').hidden=true;return;
  }
  if(!(loaded.p&&loaded.w&&loaded.s&&loaded.c)&&!forceShow){
    m.innerHTML='<div class="empty">Carregando…</div>';$('fab').hidden=true;return;
  }
  var C=curComp(),P=C.members,S=P.map(function(p){return stats(p.id,C);});
  syncTabs(C);
  var t=today();
  var left=t>C.end?'Encerrado':(t<C.start?'Começa em '+diffDays(t,C.start)+' dias':'Faltam '+diffDays(t,C.end)+' dias');
  var who=C.isAll?'todos juntos':P.map(function(p){return esc(p.name);}).join(' x ');
  var h='<div class="hero"><div><h1>'+esc(C.name)+'</h1><div class="sub">'+who+' · '+fmtShort(C.start)+' → '+fmtShort(C.end)+modeLabel(C)+'</div></div>'+
        '<div class="hbtns"><span class="chip">'+left+'</span><button type="button" class="icon" data-act="settings" aria-label="Ajustes">⚙︎</button></div></div>';
  h+=compBar(C);
  if(subErr)h+='<div class="banner">'+esc(subErr)+'</div>';
  var mine=me();
  if(!mine)h+='<div class="banner">Você ainda não escolheu quem é. <b data-act="join" style="text-decoration:underline;cursor:pointer">Escolher agora</b></div>';
  if(tab==='cal')h+=viewCal();
  else if(tab==='placar')h+=viewPlacar(P,S,C);
  else if(!P.length)h+='<div class="card"><div class="empty">Sem participantes nesta competição.</div></div>';
  else if(tab==='corrida')h+=viewCorrida(P,S,C);
  else if(tab==='academia')h+=viewAcademia(P,S,C);
  else h+=viewHist(P,C);
  m.innerHTML=h;
  var fab=$('fab');
  if(mine){fab.hidden=false;fab.textContent='＋ Registrar';fab.setAttribute('data-act','add');}
  else{fab.hidden=false;fab.textContent='Quem é você?';fab.setAttribute('data-act','join');}
}

      return '<button type="button" class="'+(compMode===m[0]?'on':'')+'" data-act="cmode" data-m="'+m[0]+'">'+m[1]+'</button>';
    }).join('')+'</div>'+
    '<div class="two"><label>Início<input id="cStart" type="date" min="'+minS+'" max="'+END+'" value="'+minS+'"></label>'+
    '<label>Fim<input id="cEnd" type="date" min="'+START+'" max="'+END+'" value="'+(c?c.end:END)+'"></label></div>'+
    '<div class="sub" style="margin-top:8px">Só contam os treinos a partir da data de início. O que foi feito antes não entra.</div>'+
    '<button type="button" class="btn" data-act="savecomp" id="btnComp">'+(c?'Salvar alterações':'Criar competição')+'</button>'+
    (c?'<button type="button" class="btn danger" data-act="delcomp" id="btnDelComp">Apagar competição</button>':'')+
    '<button type="button" class="btn ghost" data-act="close">Cancelar</button>');
}

function writeError(e){
  if(e&&e.code==='permission-denied')toast('Sem permissão. Confira as regras do Firestore.');
  else toast('Não consegui salvar. Tente de novo.');
}

function setUid(id){
  uid=id;
  try{if(id)localStorage.setItem(UID_KEY,id);else localStorage.removeItem(UID_KEY);}catch(e){}
}
function setSel(id){
  sel=id;
  try{localStorage.setItem(SEL_KEY,id);}catch(e){}
}

async function saveJoin(){
  var n=($('fName').value||'').trim();
  if(!n){toast('Digite seu nome');return;}
  if(!db)return;
  if(players.length>=MAX_PLAYERS){toast('A disputa já tem '+MAX_PLAYERS+' jogadores');return;}
  var id='p_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  var b=$('btnJoin');b.disabled=true;
  try{await db.doc('players/'+id).set({name:n,joinedAt:Date.now()});setUid(id);closeSheet();render();toast('Bem-vindo, '+n+'! 🔥');}
  catch(e){writeError(e);b.disabled=false;}
}

function claimPlayer(id){
  if(!players.some(function(p){return p.id===id;}))return;
  setUid(id);closeSheet();render();toast('Pronto! Agora é só registrar 💪');
}

async function saveWorkout(){
  if(saving||!db||!uid)return;
  var date=$('fDate').value;
  if(!date||date<START||date>END){toast('Data fora do período do desafio');return;}
  if(date>today()){toast('Não vale registrar treino do futuro 😉');return;}
  var doc={uid:uid,type:addKind,date:date,ts:Date.now()};
  if(addKind==='run'){
    var km=parseFloat(($('fKm').value||'').replace(',','.'));
    if(!(km>0)||km>200){toast('Informe os km corridos');return;}
    doc.km=Math.round(km*100)/100;
  }else{
    if(!selM.size){toast('Escolha ao menos um grupo muscular');return;}
    doc.muscles=MUSCLES.filter(function(m){return selM.has(m);});
  }
  var dur=parseInt($('fDur').value,10);
  if(dur>0&&dur<1000)doc.dur=dur;
  saving=true;var b=$('btnSave');b.disabled=true;
  try{await db.collection('workouts').add(doc);closeSheet();toast('Treino salvo! 💪');}
  catch(e){writeError(e);if($('btnSave'))$('btnSave').disabled=false;}
  finally{saving=false;}
}

async function saveSettings(){
  if(!db)return;
  var g=parseInt($('sGoal').value,10);
  var sn=$('sName');
  try{
    if(sn){
      var n=(sn.value||'').trim();
      if(n&&me()&&n!==me().name)await db.doc('players/'+uid).update({name:n});
    }
    if(g>=10&&g<=2000&&g!==(settings.kmGoal||DEFAULT_GOAL))await db.doc('settings/main').set({kmGoal:g});
    closeSheet();toast('Ajustes salvos');
  }catch(e){writeError(e);}
}

async function saveComp(){
  if(!db||!uid)return;
  var others=players.filter(function(p){return selMem.has(p.id);}).map(function(p){return p.id;});
  var members=[uid].concat(others);
  if(members.length<2){toast('Escolha pelo menos mais uma pessoa');return;}
  var cur=editId?comps.find(function(x){return x.id===editId;}):null;
  var minS=cur?cur.start:clampDate(today());
  var st=$('cStart').value,en=$('cEnd').value;
  if(!st||!en||st>en||en>END){toast('Datas inválidas');return;}
  if(st<minS){toast('O início não pode ser antes de '+fmtShort(minS)+' — treinos anteriores não entram');return;}
  var nm=($('cName').value||'').trim();
  if(!nm){
    nm=members.map(function(id){var p=players.find(function(x){return x.id===id;});return p?p.name:'?';}).slice(0,3).join(' x ');
  }
  var b=$('btnComp');b.disabled=true;
  try{
    if(editId){
      await db.doc('competitions/'+editId).update({name:nm,members:members,start:st,end:en,mode:compMode});
      closeSheet();toast('Competição atualizada');
    }else{
      var ref=await db.collection('competitions').add({name:nm,members:members,start:st,end:en,mode:compMode,createdBy:uid,ts:Date.now()});
      setSel(ref.id);closeSheet();render();toast('Competição criada! 🔥');
    }
  }catch(e){writeError(e);if($('btnComp'))$('btnComp').disabled=false;}
}

async function deleteComp(){
  if(!db||!editId)return;
  var b=$('btnDelComp');
  if(!delArm){delArm=true;if(b)b.textContent='Confirmar exclusão?';return;}
  try{
    await db.doc('competitions/'+editId).delete();
    if(sel===editId)setSel('all');
    closeSheet();render();toast('Competição apagada');
  }catch(e){writeError(e);}
}

async function deleteWorkout(id){
  if(!db)return;
  try{await db.doc('workouts/'+id).delete();delId=null;toast('Treino apagado');}
  catch(e){writeError(e);}
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='tab'){
    tab=el.getAttribute('data-t');
    document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b===el);});
    delId=null;render();window.scrollTo(0,0);
  }else if(act==='add')openAdd();
  else if(act==='join')openJoin();
  else if(act==='settings')openSettings();
  else if(act==='close')closeSheet();
  else if(act==='selcomp'){setSel(el.getAttribute('data-id'));delId=null;render();}
  else if(act==='newcomp')openComp(null);
  else if(act==='editcomp')openComp(sel);
  else if(act==='mchip'){
    var id=el.getAttribute('data-id');
    if(selMem.has(id)){selMem.delete(id);el.classList.remove('on');}else{selMem.add(id);el.classList.add('on');}
  }
  else if(act==='cmode'){
    compMode=el.getAttribute('data-m');
    document.querySelectorAll('#modeSeg button').forEach(function(b){b.classList.toggle('on',b===el);});
  }
  else if(act==='calpid'){calPid=el.getAttribute('data-id');calDay=null;render();}
  else if(act==='calkind'){calKind=el.getAttribute('data-k');calDay=null;render();}
  else if(act==='calmonth'){
    var nm=shiftMonth(calMonth,+el.getAttribute('data-d'));
    if(nm>=START.slice(0,7)&&nm<=END.slice(0,7)){calMonth=nm;calDay=null;render();}
  }
  else if(act==='calday'){var dd=el.getAttribute('data-d');calDay=(calDay===dd)?null:dd;render();}
  else if(act==='savecomp')saveComp();
  else if(act==='delcomp')deleteComp();
  else if(act==='kind'){
    addKind=el.getAttribute('data-k');
    document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b===el);});
    $('blkRun').hidden=addKind!=='run';$('blkGym').hidden=addKind!=='gym';
  }else if(act==='chip'){
    var m=el.getAttribute('data-m');
    if(selM.has(m)){selM.delete(m);el.classList.remove('on');}else{selM.add(m);el.classList.add('on');}
  }
  else if(act==='save')saveWorkout();
  else if(act==='claim')claimPlayer(el.getAttribute('data-id'));
  else if(act==='switch'){setUid(null);closeSheet();render();openJoin();}
  else if(act==='saveJoin')saveJoin();
  else if(act==='saveSettings')saveSettings();
  else if(act==='del'){
    var wid=el.getAttribute('data-id');
    if(delId===wid){clearTimeout(delTimer);deleteWorkout(wid);}
    else{delId=wid;render();clearTimeout(delTimer);delTimer=setTimeout(function(){delId=null;render();},3500);}
  }
});

/* ---------- dados ---------- */
function onErr(e){
  subErr=(e&&e.code==='permission-denied')?'Sem permissão para ler os dados. Confira as regras do Firestore (inclua a coleção competitions).':'Falha ao sincronizar. Tente recarregar.';
  loaded.p=loaded.w=loaded.s=loaded.c=true;render();
}

function maybePromptJoin(){
  if(!loaded.p)return;
  if(uid&&!me())setUid(null);
  if(joinPrompted||me())return;
  joinPrompted=true;openJoin();
}

async function init(){
  render();
  setTimeout(function(){forceShow=true;render();},3000);
  try{uid=localStorage.getItem(UID_KEY)||null;sel=localStorage.getItem(SEL_KEY)||'all';}catch(e){uid=null;sel='all';}
  if(!firebaseConfig.apiKey||firebaseConfig.apiKey.indexOf('COLE')===0){needConfig=true;nodb=true;render();return;}
  try{db=makeDb();}catch(e){nodb=true;render();return;}
  db.collection('players').onSnapshot(function(s){
    players=s.docs.map(function(d){var x=d.data()||{};return {id:d.id,name:x.name||'Jogador',joinedAt:x.joinedAt||0};})
      .sort(function(a,b){return a.joinedAt-b.joinedAt;});
    loaded.p=true;render();maybePromptJoin();
  },onErr);
  db.collection('workouts').onSnapshot(function(s){
    workouts=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});
    loaded.w=true;render();
  },onErr);
  db.collection('competitions').onSnapshot(function(s){
    comps=s.docs.map(function(d){var x=d.data()||{};return {id:d.id,name:x.name||'Competição',members:x.members||[],mode:x.mode||'both',start:x.start||START,end:x.end||END,createdBy:x.createdBy||null,ts:x.ts||0};})
      .sort(function(a,b){return a.ts-b.ts;});
    loaded.c=true;render();
  },onErr);
  db.doc('settings/main').onSnapshot(function(s){
    var x=s.exists?s.data():null;
    settings={kmGoal:(x&&x.kmGoal>0)?x.kmGoal:DEFAULT_GOAL};
    loaded.s=true;render();
  },onErr);
}
init();
})();
</script>
